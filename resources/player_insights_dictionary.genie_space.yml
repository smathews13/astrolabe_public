# Dictionary Genie space: business definitions and usage guardrails. The agent
# consults it for semantic checks, never for metrics.
# The data_dictionary table must also be present in the model manifest.
# After deploy, confirm the live space matches this file with:
#   TARGET=<target> bundle/genie-drift.sh
# The `version` field does not prove the instructions match.

resources:
  genie_spaces:
    dictionary_genie_space:
      title: Player Insights Data Dictionary
      description: >-
        Business definitions, sensitivity, and usage guardrails for
        representative Player Insights fields
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.genie_parent_path}
      lifecycle:
        prevent_destroy: true
      serialized_space:
        version: 2
        data_sources:
          tables: ${var.dictionary_genie_tables}
        instructions:
          text_instructions:
            - id: "20000000000000000000000000000005"
              content:
                - >-
                  Answer only from data_dictionary business_definition,
                  sensitivity, and usage_guardrail. Sensitivity is what a
                  question about restricted or sensitive fields is asking for,
                  and omitting it from this list left "which fields are
                  restricted?" — a question this space offers as an example —
                  answerable only by ignoring the instruction. A row is keyed by
                  table_name and column_name, so name both when a column name
                  occurs in more than one table. This space contains metadata,
                  not player metrics. Clearly distinguish documented definitions
                  from inference. Never infer permission to combine the Northwind
                  and Contoso labels; when a request would bridge identity across
                  labels, cite identity_use_scope as the field that governs it.
                  If a field is absent, say it is not documented rather than
                  guessing. Make no claim about whether the data is real,
                  generated, demo or live, and do not raise the question
                  unprompted: nothing here establishes which it is, so a
                  statement either way would be invented.
        config:
          sample_questions:
            - id: "20000000000000000000000000000001"
              question:
                - What does recurrent consumer spending cover?
            - id: "20000000000000000000000000000002"
              question:
                - What governs cross-label identity use?
            - id: "20000000000000000000000000000003"
              question:
                - How is net bookings defined?
            - id: "20000000000000000000000000000004"
              question:
                - Which fields are restricted?

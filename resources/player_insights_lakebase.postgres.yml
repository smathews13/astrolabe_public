# Lakebase (Postgres) is the app's own state store: conversations, messages,
# attachments, benchmark suites/runs, and feedback.
# The app creates its schema and tables at startup. This bundle creates the
# project, branch, and database.
# Existing branches and databases with matching names are updated; an existing
# project with the configured ID causes deployment to fail.
# After the app service principal exists, grant it USAGE and CREATE on the app
# schema with player-insights-agent/scripts/grant-app-db-access.mjs.

resources:
  postgres_projects:
    player_insights_lakebase:
      project_id: ${var.lakebase_project_id}
      display_name: ${var.lakebase_project_display_name}
      pg_version: 17
      default_branch: ${var.postgres_branch_name}
      default_endpoint_settings:
        autoscaling_limit_min_cu: ${var.lakebase_min_cu}
        autoscaling_limit_max_cu: ${var.lakebase_max_cu}
      lifecycle:
        # Destroying the project permanently removes all app state.
        prevent_destroy: true

  postgres_branches:
    player_insights_branch:
      branch_id: ${var.lakebase_branch_id}
      parent: projects/${var.lakebase_project_id}
      no_expiry: true
      replace_existing: true
      lifecycle:
        prevent_destroy: true

  postgres_databases:
    player_insights_database:
      database_id: ${var.lakebase_database_id}
      parent: ${var.postgres_branch_name}
      # REQUIRED. Supply an existing role ID from
      # `databricks postgres list-roles`; it cannot be derived from the username.
      role: ${var.postgres_owner_role_name}
      replace_existing: true
      lifecycle:
        prevent_destroy: true
